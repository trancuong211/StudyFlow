<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">Lưu đồ tính điểm rủi ro trễ hạn StudyFlow</title><desc id="desc">Nếu đã học đủ thì điểm 0. Nếu còn thời gian cần học và đã quá hạn thì điểm 100. Nếu chưa quá hạn, lấy điểm cao nhất từ thiếu lịch, deadline trong 48 giờ, thiếu sức chứa và ngày quá tải, sau đó hiển thị nhãn cùng lý do.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="black"/></marker></defs><rect width="1920" height="1080" fill="white"/><g font-family="Times New Roman" fill="black"><text x="960" y="64" text-anchor="middle" font-size="44" font-weight="700">TASK 5 – LƯU ĐỒ TÍNH ĐIỂM RỦI RO TRỄ HẠN</text><text x="960" y="112" text-anchor="middle" font-size="28" font-weight="400">R: phút cần học còn lại · M: phút chưa đủ lịch · q = M/R khi R &gt; 0</text><rect x="560" y="150" width="800" height="110" rx="12" fill="white" stroke="black" stroke-width="2.5"/><text x="960" y="188" text-anchor="middle" font-size="30" font-weight="700">Đọc task, deadline và tiến độ</text><text x="960" y="226" text-anchor="middle" font-size="25" font-weight="400">Tính R = max(0, ước tính − đã học); M = max(0, R − đã xếp)</text><path d="M960 260V285" fill="none" stroke="black" stroke-width="2.5" marker-end="url(#a)"/><polygon points="960,285 1140,340 960,395 780,340" fill="white" stroke="black" stroke-width="2.5"/><text x="960" y="349" text-anchor="middle" font-size="28" font-weight="700">R = 0?</text><path d="M1140 340H1360" fill="none" stroke="black" stroke-width="2.5" marker-end="url(#a)"/><text x="1240" y="322" text-anchor="middle" font-size="26" font-weight="400">Có</text><rect x="1360" y="285" width="450" height="110" rx="12" fill="white" stroke="black" stroke-width="2.5"/><text x="1585" y="323" text-anchor="middle" font-size="30" font-weight="700">Điểm 0 – LOW</text><text x="1585" y="361" text-anchor="middle" font-size="25" font-weight="400">Đã học đủ thời lượng ước tính</text><path d="M960 395V425" fill="none" stroke="black" stroke-width="2.5" marker-end="url(#a)"/><text x="1000" y="418" text-anchor="middle" font-size="24" font-weight="400">Không</text><polygon points="960,425 1140,480 960,535 780,480" fill="white" stroke="black" stroke-width="2.5"/><text x="960" y="489" text-anchor="middle" font-size="28" font-weight="700">Đã quá hạn?</text><path d="M1140 480H1360" fill="none" stroke="black" stroke-width="2.5" marker-end="url(#a)"/><text x="1240" y="462" text-anchor="middle" font-size="26" font-weight="400">Có</text><rect x="1360" y="425" width="450" height="110" rx="12" fill="white" stroke="black" stroke-width="2.5"/><text x="1585" y="463" text-anchor="middle" font-size="30" font-weight="700">Điểm 100 – CRITICAL</text><text x="1585" y="501" text-anchor="middle" font-size="25" font-weight="400">Vẫn còn thời lượng cần học</text><path d="M960 535V580" fill="none" stroke="black" stroke-width="2.5" marker-end="url(#a)"/><text x="1007" y="566" text-anchor="middle" font-size="24" font-weight="400">Không</text><text x="960" y="615" text-anchor="middle" font-size="30" font-weight="700">Tính các điểm ứng viên, lấy điểm cao nhất; không thỏa điều kiện thì điểm 0</text><rect x="100" y="650" width="400" height="180" rx="12" fill="white" stroke="black" stroke-width="2.5"/><text x="300" y="688" text-anchor="middle" font-size="30" font-weight="700">Thiếu lịch (M &gt; 0)</text><text x="300" y="726" text-anchor="middle" font-size="25" font-weight="400">40 + ceil(19q)</text><text x="300" y="761" text-anchor="middle" font-size="25" font-weight="400">Điểm 41–59</text><rect x="540" y="650" width="400" height="180" rx="12" fill="white" stroke="black" stroke-width="2.5"/><text x="740" y="688" text-anchor="middle" font-size="30" font-weight="700">M &gt; 0, hạn ≤ 48 giờ</text><text x="740" y="726" text-anchor="middle" font-size="25" font-weight="400">70 + ceil(15q)</text><text x="740" y="761" text-anchor="middle" font-size="25" font-weight="400">Điểm 71–85</text><rect x="980" y="650" width="400" height="180" rx="12" fill="white" stroke="black" stroke-width="2.5"/><text x="1180" y="688" text-anchor="middle" font-size="30" font-weight="700">M &gt; 0, C &gt; A</text><text x="1180" y="726" text-anchor="middle" font-size="25" font-weight="400">85 + ceil(14(C−A)/max(1,C))</text><text x="1180" y="761" text-anchor="middle" font-size="25" font-weight="400">Điểm 86–99</text><rect x="1420" y="650" width="400" height="180" rx="12" fill="white" stroke="black" stroke-width="2.5"/><text x="1620" y="688" text-anchor="middle" font-size="30" font-weight="700">Có lịch ngày quá tải</text><text x="1620" y="726" text-anchor="middle" font-size="25" font-weight="400">Điểm tối thiểu 70</text><text x="1620" y="761" text-anchor="middle" font-size="25" font-weight="400">Không ghi đè điểm cao hơn</text><path d="M300 830V875H960V915" fill="none" stroke="black" stroke-width="2.5" marker-end="url(#a)"/><path d="M740 830V875" fill="none" stroke="black" stroke-width="2.5"/><path d="M1180 830V875H960" fill="none" stroke="black" stroke-width="2.5"/><path d="M1620 830V875H960" fill="none" stroke="black" stroke-width="2.5"/><rect x="500" y="915" width="920" height="100" rx="12" fill="white" stroke="black" stroke-width="2.5"/><text x="960" y="953" text-anchor="middle" font-size="30" font-weight="700">Hiển thị điểm, mức rủi ro và lý do</text><text x="960" y="991" text-anchor="middle" font-size="25" font-weight="400">Dưới 30: LOW · 30–69: MEDIUM · 70–99: HIGH · 100: CRITICAL</text><path d="M1810 340H1860V965H1420" fill="none" stroke="black" stroke-width="2.5" marker-end="url(#a)"/><path d="M1810 480H1860" fill="none" stroke="black" stroke-width="2.5"/><text x="960" y="1055" text-anchor="middle" font-size="26" font-weight="400">A: phút trống trước hạn · C: tổng phút chưa xếp đến mốc hạn · Điểm không phải xác suất trễ hạn</text></g></svg>
