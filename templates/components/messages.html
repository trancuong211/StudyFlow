{% if messages %}
<div class="messages" role="region" aria-live="polite" aria-label="Thông báo">
    {% for message in messages %}
    <div class="message{% if message.tags == 'success' %} message--success{% elif message.tags == 'warning' %} message--warning{% elif message.tags == 'error' %} message--error{% endif %}" role="alert" data-autodismiss>
        <span class="message__icon" aria-hidden="true">
            {% if message.tags == 'success' %}
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/></svg>
            {% elif message.tags == 'warning' %}
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
            {% elif message.tags == 'error' %}
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>
            {% else %}
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
            {% endif %}
        </span>
        <div class="message__body">{{ message }}</div>
        <button type="button" class="message__close" data-dismiss aria-label="Đóng thông báo">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
    </div>
    {% endfor %}
</div>
{% endif %}
