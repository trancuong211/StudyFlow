<header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <span class="text-2xl font-black bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">
                StudyFlow
            </span>
            <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-blue-50 text-blue-700 border border-blue-200">
                AI Powered
            </span>
        </div>

        <div class="flex items-center space-x-4">
            {% if user.is_authenticated %}
                <div class="flex items-center space-x-2 text-sm text-slate-700">
                    <span class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-700 font-bold flex items-center justify-center">
                        {{ user.username|slice:":1"|upper }}
                    </span>
                    <span class="font-medium hidden sm:inline">{{ user.full_name|default:user.username }}</span>
                </div>
                <form action="{% url 'accounts:logout' %}" method="post" class="inline">
                    {% csrf_token %}
                    <button type="submit" class="text-xs text-red-600 hover:text-red-800 font-medium px-2.5 py-1.5 rounded-md hover:bg-red-50 transition">
                        Đăng xuất
                    </button>
                </form>
            {% else %}
                <a href="{% url 'accounts:login' %}" class="text-sm font-medium text-slate-700 hover:text-blue-600">Đăng nhập</a>
                <a href="{% url 'accounts:register' %}" class="text-sm font-medium bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-2 rounded-lg shadow-sm transition">Đăng ký</a>
            {% endif %}
        </div>
    </div>
</header>
