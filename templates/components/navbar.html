<header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <!-- Logo & Mobile Menu Button -->
        <div class="flex items-center space-x-4">
            <button
                type="button"
                id="sidebarToggle"
                class="lg:hidden p-2 rounded-lg text-slate-500 hover:text-slate-700 hover:bg-slate-100 transition-colors"
                aria-label="Mở menu điều hướng"
                aria-expanded="false"
                aria-controls="sidebar"
            >
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>

            <a href="{% url 'dashboard:index' %}" class="flex items-center space-x-2" aria-label="StudyFlow - Trang chủ">
                <span class="text-2xl font-extrabold bg-gradient-to-r from-brand-600 to-indigo-600 bg-clip-text text-transparent">
                    StudyFlow
                </span>
                <span class="hidden sm:inline-block text-[10px] font-semibold px-1.5 py-0.5 rounded bg-brand-50 text-brand-700 border border-brand-200 uppercase tracking-wider">
                    AI
                </span>
            </a>
        </div>

        <!-- Right side: User menu -->
        <div class="flex items-center space-x-3">
            {% if user.is_authenticated %}
                <div class="relative" id="userMenu">
                    <button
                        type="button"
                        id="userMenuButton"
                        class="flex items-center space-x-2 p-1.5 rounded-xl hover:bg-slate-100 transition-colors focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2"
                        aria-expanded="false"
                        aria-haspopup="true"
                        aria-label="Menu người dùng"
                    >
                        <div class="w-8 h-8 rounded-full bg-brand-100 text-brand-700 font-bold flex items-center justify-center text-sm">
                            {{ user.username|slice:":1"|upper }}
                        </div>
                        <span class="hidden md:inline font-medium text-slate-700 text-sm">{{ user.full_name|default:user.username }}</span>
                        <svg class="w-4 h-4 text-slate-400 hidden md:block" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </button>

                    <!-- Dropdown Menu -->
                    <div
                        id="userDropdown"
                        class="absolute right-0 mt-2 w-48 origin-top-right rounded-xl bg-white border border-slate-200 shadow-lg opacity-0 invisible scale-95 transition-all duration-150 z-50"
                        role="menu"
                        aria-orientation="vertical"
                        aria-labelledby="userMenuButton"
                    >
                        <div class="p-2 border-b border-slate-100">
                            <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider px-2 py-1">Tài khoản</p>
                        </div>
                        <a
                            href="{% url 'accounts:profile' %}"
                            class="flex items-center space-x-2 px-3 py-2 text-sm text-slate-700 hover:bg-slate-50 rounded-lg transition-colors"
                            role="menuitem"
                        >
                            <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                            <span>Hồ sơ</span>
                        </a>
                        <hr class="my-1 border-slate-100">
                        <form action="{% url 'accounts:logout' %}" method="post" class="w-full">
                            {% csrf_token %}
                            <button
                                type="submit"
                                class="flex items-center space-x-2 w-full px-3 py-2 text-sm text-red-600 hover:bg-red-50 rounded-lg transition-colors"
                                role="menuitem"
                            >
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                                <span>Đăng xuất</span>
                            </button>
                        </form>
                    </div>
                </div>
            {% else %}
                <div class="flex items-center space-x-2">
                    <a href="{% url 'accounts:login' %}" class="text-sm font-medium text-slate-700 hover:text-brand-600 transition-colors px-3 py-2 rounded-lg">Đăng nhập</a>
                    <a href="{% url 'accounts:register' %}" class="text-sm font-semibold bg-brand-600 hover:bg-brand-700 text-white px-4 py-2 rounded-xl shadow-sm transition-colors">Đăng ký</a>
                </div>
            {% endif %}
        </div>
    </div>
</header>

<script>
    // User dropdown toggle
    const userMenuButton = document.getElementById('userMenuButton');
    const userDropdown = document.getElementById('userDropdown');
    const userMenu = document.getElementById('userMenu');

    if (userMenuButton && userDropdown) {
        userMenuButton.addEventListener('click', (e) => {
            e.stopPropagation();
            const isOpen = userDropdown.classList.toggle('opacity-0');
            userDropdown.classList.toggle('invisible');
            userDropdown.classList.toggle('scale-95');
            userDropdown.classList.toggle('scale-100');
            userMenuButton.setAttribute('aria-expanded', !isOpen);
        });

        // Close on outside click
        document.addEventListener('click', (e) => {
            if (userMenu && !userMenu.contains(e.target)) {
                userDropdown.classList.add('opacity-0', 'invisible', 'scale-95');
                userDropdown.classList.remove('scale-100');
                userMenuButton.setAttribute('aria-expanded', 'false');
            }
        });

        // Close on Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                userDropdown.classList.add('opacity-0', 'invisible', 'scale-95');
                userDropdown.classList.remove('scale-100');
                userMenuButton.setAttribute('aria-expanded', 'false');
                userMenuButton.focus();
            }
        });
    }
</script>
