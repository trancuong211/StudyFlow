<header class="topbar{% if not user.is_authenticated %} topbar--public{% endif %}">
    {% if user.is_authenticated %}
        <button
            type="button"
            class="topbar__menu-btn"
            data-sidebar-open
            aria-label="Mở menu điều hướng"
            aria-controls="sidebar"
            aria-expanded="false"
        >
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
        </button>

        <a href="{% url 'dashboard:index' %}" class="topbar__brand" aria-label="StudyFlow - Trang chủ">
            StudyFlow
        </a>

        <button
            type="button"
            class="theme-toggle btn--icon topbar__user"
            data-theme-toggle
            aria-label="Chuyển sang giao diện tối"
            aria-pressed="false"
        >
            <svg class="theme-icon theme-icon--moon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
            </svg>
            <svg class="theme-icon theme-icon--sun" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2"/><path d="M12 20v2"/>
                <path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/>
                <path d="M2 12h2"/><path d="M20 12h2"/>
                <path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
            </svg>
        </button>
    {% else %}
        <a href="{% url 'dashboard:index' %}" class="topbar__brand" aria-label="StudyFlow - Trang chủ">
            StudyFlow
        </a>

        <div class="topbar__actions">
            <button
                type="button"
                class="theme-toggle btn--icon"
                data-theme-toggle
                aria-label="Chuyển sang giao diện tối"
                aria-pressed="false"
            >
                <svg class="theme-icon theme-icon--moon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
                </svg>
                <svg class="theme-icon theme-icon--sun" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2"/><path d="M12 20v2"/>
                    <path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/>
                    <path d="M2 12h2"/><path d="M20 12h2"/>
                    <path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
                </svg>
            </button>
            <a href="{% url 'accounts:login' %}" class="btn btn--ghost btn--sm">Đăng nhập</a>
            <a href="{% url 'accounts:register' %}" class="btn btn--primary btn--sm">Đăng ký</a>
        </div>
    {% endif %}
</header>
