{% extends 'base.html' %}

{% block title %}Xác nhận xóa – StudyFlow{% endblock %}

{% block content %}
    <div class="sf-card w-full space-y-5">
        <h1 class="text-2xl font-bold">Xác nhận xóa</h1>
        <p>Bạn muốn xóa <strong>{{ item }}</strong>? Thao tác này không thể hoàn tác.</p>

        <form method="post" class="flex gap-3">
            {% csrf_token %}
            <button class="sf-button sf-danger" type="submit">Xóa</button>
            <a class="sf-secondary" href="{% url back_url %}">Hủy</a>
        </form>
    </div>
{% endblock %}
