{% extends 'base.html' %}

{% block title %}Đăng Nhập – StudyFlow{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-8rem)] flex items-center justify-center">
    <div class="w-full max-w-md">
        <!-- Logo & Heading -->
        <div class="text-center mb-8">
            <a href="/" class="inline-flex items-center gap-2 mb-6">
                <span class="text-3xl font-extrabold bg-gradient-to-r from-brand-600 to-indigo-600 bg-clip-text text-transparent">StudyFlow</span>
            </a>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">Chào mừng trở lại</h1>
            <p class="text-sm text-slate-500 mt-1.5">Đăng nhập để xem lịch học tập và tối ưu thời gian của bạn.</p>
        </div>

        <!-- Form Card -->
        <div class="bg-white p-6 sm:p-8 rounded-xl border border-slate-200 shadow-sm">
            <form method="post" class="space-y-4">
                {% csrf_token %}

                <div>
                    <label for="id_username" class="block text-sm font-medium text-slate-700 mb-1.5">Tên đăng nhập hoặc Email</label>
                    <input
                        type="text"
                        name="username"
                        id="id_username"
                        required
                        autofocus
                        autocomplete="username"
                        placeholder="Nhập tên đăng nhập..."
                        class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100 transition-colors"
                    >
                </div>

                <div>
                    <label for="id_password" class="block text-sm font-medium text-slate-700 mb-1.5">Mật khẩu</label>
                    <input
                        type="password"
                        name="password"
                        id="id_password"
                        required
                        autocomplete="current-password"
                        placeholder="Nhập mật khẩu..."
                        class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100 transition-colors"
                    >
                </div>

                <button type="submit" class="w-full py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm shadow-sm transition-colors">
                    Đăng nhập
                </button>
            </form>

            <div class="mt-5 pt-5 border-t border-slate-100 text-center text-sm text-slate-500">
                Chưa có tài khoản?
                <a href="{% url 'accounts:register' %}" class="font-semibold text-brand-600 hover:text-brand-700 transition-colors">Đăng ký ngay</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
