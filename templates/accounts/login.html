{% extends 'base.html' %}

{% block title %}Đăng Nhập – StudyFlow{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12 bg-white p-8 rounded-3xl border border-slate-200 shadow-sm">
    <div class="text-center mb-8">
        <h1 class="text-2xl font-black text-slate-900">Chào Mừng Trở Lại! 👋</h1>
        <p class="text-xs text-slate-500 mt-1">Đăng nhập để xem lịch học tập và tối ưu hóa thời gian của bạn.</p>
    </div>

    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Tên đăng nhập hoặc Email</label>
            <input type="text" name="username" required autofocus class="w-full rounded-xl border border-slate-300 p-2.5 text-sm focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100">
        </div>

        <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Mật khẩu</label>
            <input type="password" name="password" required class="w-full rounded-xl border border-slate-300 p-2.5 text-sm focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100">
        </div>

        <button type="submit" class="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm shadow-md transition">
            Đăng Nhập
        </button>
    </form>

    <div class="mt-6 pt-6 border-t border-slate-100 text-center text-xs text-slate-500">
        Chưa có tài khoản? 
        <a href="{% url 'accounts:register' %}" class="font-bold text-blue-600 hover:underline">Đăng ký ngay</a>
    </div>
</div>
{% endblock %}
