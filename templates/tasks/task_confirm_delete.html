{% extends 'base.html' %}

{% block title %}Xác nhận xóa công việc – StudyFlow{% endblock %}

{% block content %}
<div class="w-full my-8">
    <!-- Dialog Card -->
    <div class="bg-white rounded-xl border border-slate-200 shadow-lg overflow-hidden">
        <!-- Header -->
        <div class="p-6 text-center border-b border-slate-100">
            <div class="w-12 h-12 rounded-full bg-red-50 text-red-500 flex items-center justify-center mx-auto mb-4">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            </div>
            <h2 class="text-lg font-bold text-slate-900">Xóa công việc?</h2>
            <p class="text-sm text-slate-500 mt-2 leading-relaxed">
                Bạn có chắc chắn muốn xóa <strong class="text-slate-700">"{{ task.title }}"</strong>? Các block lịch liên kết sẽ bị xóa và không thể hoàn tác.
            </p>
        </div>

        <!-- Actions -->
        <div class="p-4 bg-slate-50 flex gap-3">
            <a href="{% url 'tasks:list' %}" class="flex-1 px-4 py-2.5 rounded-xl border border-slate-200 bg-white text-slate-700 hover:bg-slate-50 text-sm font-medium text-center transition-colors">
                Hủy bỏ
            </a>
            <form method="post" class="flex-1">
                {% csrf_token %}
                <button type="submit" class="w-full px-4 py-2.5 rounded-xl bg-red-600 hover:bg-red-700 text-white text-sm font-medium shadow-sm transition-colors">
                    Xác nhận xóa
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
