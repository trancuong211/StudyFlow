{% extends 'base.html' %}

{% block title %}Xác nhận xóa môn học – StudyFlow{% endblock %}

{% block content %}
<div class="confirm-card card">
    <div class="confirm-card__head">
        <div class="confirm-card__icon">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
        </div>
        <h1 class="confirm-card__title">Xóa môn học?</h1>
        <p class="confirm-card__text">
            Bạn có chắc muốn xóa <strong>"{{ course.name }}"</strong>? Các công việc liên kết sẽ bị hủy gán môn học này.
        </p>
    </div>

    <div class="confirm-card__actions">
        <a href="{% url 'courses:list' %}" class="btn btn--secondary">Hủy bỏ</a>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn--danger">Xác nhận xóa</button>
        </form>
    </div>
</div>
{% endblock %}
