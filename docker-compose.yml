x-django-env: &django-env
  DJANGO_SETTINGS_MODULE: studyflow.settings
  DEBUG: ${DEBUG:-True}
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
  USE_SQLITE: "False"
  DATABASE_URL: postgres://studyflow_user:${POSTGRES_PASSWORD:-studyflow_local_only}@db:5432/studyflow_db
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  AI_SERVICE_URL: http://ai_service:8001
  AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
  SITE_URL: ${SITE_URL:-http://localhost:8000}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
  MEDIA_ROOT: /app/media
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/calendar/oauth2callback/}
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
  EMAIL_HOST: ${EMAIL_HOST:-localhost}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@studyflow.local}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: studyflow_db
      POSTGRES_USER: studyflow_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studyflow_local_only}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U studyflow_user -d studyflow_db]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
  ai_service:
    build:
      context: .
      dockerfile: docker/Dockerfile.fastapi
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
    # Private API: only Django and the worker call it.
  web:
    build: &django-build
      context: .
      dockerfile: docker/Dockerfile.django
    environment: *django-env
    ports: ["8000:8000"]
    volumes: [media_data:/app/media]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
      ai_service: {condition: service_started}
  celery_worker:
    build: *django-build
    command: celery -A studyflow worker -l info --concurrency=2
    environment: *django-env
    depends_on:
      web: {condition: service_healthy}
      redis: {condition: service_started}
  celery_beat:
    build: *django-build
    command: celery -A studyflow beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment: *django-env
    depends_on:
      web: {condition: service_healthy}
      redis: {condition: service_started}

volumes:
  postgres_data:
  redis_data:
  media_data:
